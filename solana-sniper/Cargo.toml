[package]
name = "solana-sniper"
version = "0.1.0"
edition = "2021"
description = "Sniper de tokens nuevos en Solana — construido con modo simulacion/paper-trading primero."

[[bin]]
name = "solana-sniper"
path = "src/main.rs"

[[bin]]
name = "devnet-check"
path = "src/bin/devnet_check.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Conexion real a la cadena (usada por el binario `devnet-check` y el modo live).
solana-client = "2"
solana-sdk = "2"
solana-transaction-status = "2"   # parseo de transacciones (detector Raydium)
futures-util = "0.3"              # StreamExt para el stream de logs WebSocket
