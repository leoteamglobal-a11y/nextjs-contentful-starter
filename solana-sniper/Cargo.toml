[package]
name = "solana-sniper"
version = "0.1.0"
edition = "2021"
description = "Sniper de tokens nuevos en Solana — construido con modo simulacion/paper-trading primero."

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
